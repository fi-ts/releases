ansible-roles:
  metal-extensions-roles:
    oci: r.metal-stack.io/extensions/metal-extensions-roles
    repository: https://git.f-i-ts.de/cloud-native/metal/metal-extensions-roles
    version: v0.1.60
binaries:
  metal-stack:
    cloudctl:
      darwin:
        url: https://github.com/fi-ts/cloudctl/releases/download/v0.15.2/cloudctl-darwin-amd64
      linux:
        url: https://github.com/fi-ts/cloudctl/releases/download/v0.15.2/cloudctl-linux-amd64
      version: v0.15.2
      windows:
        url: https://github.com/fi-ts/cloudctl/releases/download/v0.15.2/cloudctl-windows-amd64
docker-images:
  metal-stack:
    extensions:
      accounting-api:
        name: r.metal-stack.io/extensions/accounting-api
        tag: v0.10.7
      accounting-exporter:
        url: https://github.com/fi-ts/accounting-exporter
        name: ghcr.io/fi-ts/accounting-exporter
        tag: v0.7.0
      cloud-api:
        name: r.metal-stack.io/extensions/cloud-api
        tag: v0.33.0
      s3-api:
        name: r.metal-stack.io/extensions/s3-api
        tag: v0.7.2
    fits:
      authn-webhook:
        name: r.metal-stack.io/extensions/kubernetes-authn-webhook
        tag: v0.4.1
      group-role-binding-controller:
        name: r.metal-stack.io/extensions/group-rolebinding-controller
        tag: v0.5.0
      virtual-garden-kubeconfig-refresher:
        name: ghcr.io/metal-stack/virtual-garden-kubeconfig-refresher
        tag: v0.1.3
    gardener:
      gardener-extension-fits-accounting:
        charts:
          extension: ghcr.io/fi-ts/charts/gardener-extension-accounting
        name: ghcr.io/fi-ts/gardener-extension-accounting
        tag: v0.1.8
      gardener-extension-fits-authn:
        charts:
          extension: ghcr.io/fi-ts/charts/gardener-extension-authn
        name: ghcr.io/fi-ts/gardener-extension-authn
        tag: v0.1.12
      gardener-extension-fits-xdr:
        charts:
          extension: ghcr.io/fi-ts/charts/gardener-extension-xdr
        name: ghcr.io/fi-ts/gardener-extension-xdr
        tag: v0.1.9
    generic:
      backup-restore-sidecar:
        name: ghcr.io/metal-stack/backup-restore-sidecar
        tag: v0.14.0
  third-party:
    control-plane:
      accounting-db:
        name: timescale/timescaledb
        tag: 2.25.1-pg15
    vmware:
      velero:
        name: velero/velero
        tag: v1.9.7
      velero-plugin-gcp:
        name: velero/velero-plugin-for-gcp
        tag: v1.5.5
helm-charts:
  postgreslet:
    repository: https://helm.metal-stack.io
    version: 0.22.1
repositories:
  fits:
    postgreslet:
      ref: v0.27.0
      url: https://github.com/fi-ts/postgreslet
vectors:
  metal-stack:
    url: oci://ghcr.io/metal-stack/releases:v0.22.20
    version: v0.22.20
